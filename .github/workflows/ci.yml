name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quri-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SBCL_VERSION: 2.4.11
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      # Install SBCL/qlot outside the checkout so `ros install` does not see quri.asd.
      - name: Install SBCL + qlot
        working-directory: ${{ runner.temp }}
        run: |
          ros install "sbcl-bin/$SBCL_VERSION"
          ros use "sbcl-bin/$SBCL_VERSION"
          ros install qlot

      - name: qlot install
        run: qlot install

      - name: Test
        run: qlot exec ros -S . -e '(asdf:test-system "quri")'
