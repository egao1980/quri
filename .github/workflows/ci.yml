name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quri-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Roswell
        run: |
          curl -sL https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | bash
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      # Install outside the checkout — `ros install` from the project dir sees
      # quri.asd → cl-idna (not on Quicklisp). qlfile pins github egao1980/cl-idna
      # for local `qlot install` consumers.
      - name: Install Prove + cl-idna
        working-directory: ${{ runner.temp }}
        run: |
          ros install prove
          git clone --depth 1 https://github.com/egao1980/cl-idna.git \
            "$HOME/quicklisp/local-projects/cl-idna"
          ln -sfn "$GITHUB_WORKSPACE" "$HOME/quicklisp/local-projects/quri"
          ros -e '(ql:register-local-projects)' \
              -e '(ql:quickload :cl-idna)'

      - name: Run tests
        run: |
          export CL_SOURCE_REGISTRY="${HOME}/quicklisp/local-projects/cl-idna//:${GITHUB_WORKSPACE}//:"
          PATH="${HOME}/.roswell/bin:${PATH}"
          ros -e '(ql:register-local-projects)' \
              -e '(asdf:test-system "quri")'
